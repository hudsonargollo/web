services:
  krikkit-db:
    image: mysql:8.0
    container_name: krikkit-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: krikkit
      MYSQL_USER: krikkit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - krikkit_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - krikkit-net

  krikkit-app:
    build: .
    image: krikkit-app:latest
    container_name: krikkit-app
    restart: unless-stopped
    ports:
      - "172.17.0.1:8100:8080"
    volumes:
      - ./app:/var/www/html
    depends_on:
      krikkit-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - krikkit-net

volumes:
  krikkit_db:

networks:
  krikkit-net:
    driver: bridge
